name: Test VenueHooper System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt
        playwright install chromium
    
    - name: Test import functionality
      run: |
        python -c "
        import sys, os
        sys.path.append('src')
        from src.utils.email_scraper_utils import scrape_emails_requests
        from src.ui.streamlit_app import VenueHooperWorkflow
        print('✅ All imports successful')
        "
    
    - name: Test email scraping (without API keys)
      run: |
        python -c "
        import sys, asyncio
        sys.path.append('src')
        from src.utils.email_scraper_utils import scrape_emails_requests
        # Test requests-based scraping
        emails = scrape_emails_requests('https://example.com')
        print(f'✅ Email scraping test: found {len(emails)} emails')
        "
    
    - name: Test workflow initialization
      run: |
        python -c "
        import sys, os
        sys.path.append('src')
        
        # Mock environment for testing
        os.environ['RESEND_API_KEY'] = 'test_key'
        os.environ['OPENAI_API_KEY'] = 'test_key'
        
        from src.ui.streamlit_app import VenueHooperWorkflow
        workflow = VenueHooperWorkflow()
        print('✅ Workflow initialization successful')
        "
    
    - name: Validate configuration files
      run: |
        # Check required files exist
        test -f config/requirements.txt || exit 1
        test -f src/ui/streamlit_app.py || exit 1
        test -f Dockerfile || exit 1
        test -f Procfile || exit 1
        echo '✅ All configuration files present'